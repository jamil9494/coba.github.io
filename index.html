<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klaim Reward & Cashback Shopee</title>
    <!-- Tailwind CSS untuk styling cepat dan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Shopee Style -->
    <header class="bg-orange-500 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-xl font-bold tracking-wider">Shopee Reward</span>
            </div>
            <span class="text-xs bg-orange-600 px-2.5 py-1 rounded-full font-medium">Verified Event</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow">
        <!-- Card Utama -->
        <div class="bg-white rounded-2xl shadow-sm p-6 text-center border border-slate-200">
            <!-- Icon / Ilustrasi Hadiah -->
            <div class="w-20 h-20 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                🎁
            </div>
            
            <h1 class="text-xl font-bold text-slate-800 mb-1">Klaim Cashback Anda</h1>
            <p class="text-sm text-slate-500 mb-6">Masukkan email akun Shopee Anda untuk memproses hadiah atau cashback yang tersedia.</p>

            <!-- Form Input -->
            <form id="claimForm" onsubmit="handleClaim(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Akun Shopee</label>
                    <input type="email" id="emailInput" required placeholder="namaemail@gmail.com" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm transition">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-orange-500/30 transition duration-200 text-sm">
                    Klaim Sekarang
                </button>
            </form>

            <!-- Status Pesan (Hidden Default) -->
            <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-sm font-medium"></div>
        </div>

        <!-- Informasi Tambahan -->
        <div class="mt-6 text-center text-xs text-slate-400 space-y-1">
            <p>Pastikan email yang dimasukkan sudah terdaftar di aplikasi Shopee.</p>
            <p>&copy; 2026 Shopee Reward Program. All rights reserved.</p>
        </div>
    </main>

    <!-- Footer Tipis -->
    <footer class="py-4 text-center text-xs text-slate-400">
        Secured by Netlify Deployment
    </footer>

    <!-- Script Interaktif Sederhana -->
    <script>
        function handleClaim(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');

            // Ubah tombol menjadi loading
            btn.disabled = true;
            btn.textContent = "Memproses...";
            
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = "Klaim Sekarang";
                
                // Tampilkan pesan sukses
                statusDiv.classList.remove('hidden', 'bg-red-50', 'text-red-600');
                statusDiv.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-200');
                statusDiv.innerHTML = `Berhasil! Tautan verifikasi atau konfirmasi cashback telah dikirim ke <b>${email}</b>.`;
                
                // Reset form
                document.getElementById('claimForm').reset();
            }, 1500);
        }
    </script>
</body>
</html>
